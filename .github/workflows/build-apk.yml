name: Build APK and publish update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: node build.js

      - name: Stamp app version and update address
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE="https://${OWNER}.github.io/${REPO}/"
          sed -i "s|__APP_VERSION__|${RUN_NUMBER}|g; s|__UPDATE_BASE__|${BASE}|g" dist/index.html
          NOTES="$(printf '%s' "${COMMIT_MSG:-New version}" | head -n 1)"
          jq -n --arg v "$RUN_NUMBER" --arg n "$NOTES" '{version: ($v|tonumber), notes: $n}' > dist/version.json
          echo "Update address: $BASE"
          cat dist/version.json

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#4cd68a' --iconBackgroundColorDark '#4cd68a'

      - name: Use fixed signing key and bump version
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-tasks-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: My Tasks build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Package web update
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-update:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish web update
        id: deployment
        uses: actions/deploy-pages@v4
